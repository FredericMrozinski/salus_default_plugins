<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat Plugin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chat-window">
        <div id="messages"></div>
        <form id="chat-form">
            <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" />
            <button type="submit">Send</button>
        </form>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
